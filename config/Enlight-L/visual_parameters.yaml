      origin:
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 3.141592653589793
      mesh:
        package: flexiv_description
        path: meshes/Enlight-L/collision/link3.stl
  link4:
    visual:
